app-id: page.codeberg.tpikonen.geobug
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: geobug
rename-desktop-file: geobug.desktop
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --talk-name=org.gtk.vfs.*
  - --system-talk-name=org.freedesktop.GeoClue2.*
  - --filesystem=xdg-documents/geobug-tracks:create
modules:
  - python3-requirements.json
  - name: geobug
    sources:
      - type: archive
        url: https://codeberg.org/tpikonen/geobug/archive/0.9.2.tar.gz
        sha256: 1fc931ed268b7c1d1bd15dfce1f68e6bb1476679a0197fa7123362456638d6c4
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} ./
